# Build and publish the container to GitHub Container Registry.
#
# The package inherits the repository's visibility, so a PRIVATE repo produces a
# PRIVATE image. Verify once after the first push: GitHub -> your profile ->
# Packages -> zerohero-dynamic-control -> Package settings -> Danger Zone.
#
# Multi-arch matters here: NAS boxes are a mix of x86-64 (Synology DS9xx+, most
# QNAP) and arm64 (Synology DS1xxJ, some QNAP, Raspberry Pi). Building both means
# the NAS pulls the right one without you having to know which it is.

name: docker-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to GHCR

    steps:
      - uses: actions/checkout@v4

      # QEMU lets the amd64 runner emit an arm64 layer. Slow for compiled deps;
      # ours are pure Python, so it costs little.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatic, no PAT needed here

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
